<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        th.calcmedia {
            text-align: left;
        }

        th {
            text-align: center;
            background-color: rgb(88, 86, 86);
            color: white;
        }

        td {
            text-align: left;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Desafio sobre mesclagem de células</h1>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th rowspan="2" scope="col">Área</th>
                    <th rowspan="2" scope="col">Disciplinas</th>
                    <th>Notas</th>
                    <th rowspan="2" scope="col">Média</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4" scope="rowgroup">Exatas</th>
                    <td>Matemática</td>
                    <td>6.7</td>
                    <td>5.6</td>
                    <td>null</td>
                </tr>
                <tr>
                    <td>Física</td>
                    <td>8.3</td>
                    <td>7.5</td>
                    <td>null</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td>5.4</td>
                    <td>8.7</td>
                    <td>null</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td>9.5</td>
                    <td>8.8</td>
                    <td>null</td>
                </tr>
                <tr >
                    <th class="calcmedia" colspan="4" scope="row">Média de Exatas</th>
                    <td>null</td>
                </tr>
                
                <tr>
                    <th rowspan="2" scope="rowgroup">Humanas</th>
                    <td>História</td>
                    <td>8.1</td>
                    <td>7.7</td>
                    <td>null</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>6.0</td>
                    <td>4.9</td>
                    <td>null</td>
                </tr>
                <tr >
                    <th class="calcmedia" colspan="4" scope="row">Média de Humanas</th>
                    <td>null</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
