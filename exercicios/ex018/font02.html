<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <link rel="shortcut icon" href="dragon-redflame.ico" type="image/x-icon">
    <style>
        @font-face {
            font-family: 'Love';
            src: url(beaming/Beaming.otf) format(opentype);
            font-weight: normal;
            font-style: normal;

            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - enbedded-opentype
                - truetype-aat (Apple Advanced)
                - svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Officia voluptate ullam quibusdam, doloremque sapiente eligendi consectetur nulla ad ab nisi. Sapiente fugit commodi nisi quasi eos, corrupti minus aut accusamus!</p>
</body>
</html>
