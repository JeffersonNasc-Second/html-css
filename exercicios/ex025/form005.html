<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"> <label for="isxmas"> Masculino</label>
            <input type="radio" name="sexo" id="isxfem" value="F" checked> <label for="isxfem"> Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" checked> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esvol" id="iesvol"  checked> <label for="iesvol">Vôlei</label> <br>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tênis</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
            <input type="checkbox" name="escic" id="iescic"> <label for="iescic">Ciclismo</label> <br>
            <input type="checkbox" name="escor" id="iescor"> <label for="iescor">Corrida</label> <br>
            <input type="checkbox" name="essin" id="iessin"> <label for="iessin">Sinuca</label> <br>
            <input type="checkbox" name="esbil" id="iesbil"> <label for="iesbil">Bila</label> <br>
            <input type="checkbox" name="eslan" id="ieslan"> <label for="ieslan">Lançamento</label> <br>
            <input type="checkbox" name="esesq" id="iesesq"> <label for="iesesq">Esqui</label> <br>
            <input type="checkbox" name="espat" id="iespat"> <label for="iespat">Patinação</label> <br>
            <input type="checkbox" name="esalp" id="iesalp"> <label for="iesalp">Alpinismo</label> <br>
            <input type="checkbox" name="esque" id="iesque"> <label for="iesque">Queimada</label> <br>
            <input type="checkbox" name="eslut" id="ieslut"> <label for="ieslut">Luta</label> <br>
        </fieldset>


        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
