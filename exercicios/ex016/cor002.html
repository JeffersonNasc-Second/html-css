<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <link rel="shortcut icon" href="dragon-redflame.ico" type="image/x-icon">
    <style>
        *{ /*configurações globais*/
            height: 100%;
        }
        body {
            background-image: linear-gradient( 360deg, #3198E2 -5%, #6D59C0, #B93590, #E33F5F, #FDD579);
            background-attachment: fixed;
        }

        h1 {
            color: white;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
    
</body>
</html>
