<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="dragon-redflame.ico" type="image/x-icon">
    <title>Mídias em HTML 5</title>
</head>
<body>
     <h1>Imagens dinâmicas</h1>
     <p>Tente abrir esse site em dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navagador do seu navagador.</p>

     <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Flexível">
     </picture>

     <h1>Reproduzindo Áudio</h1>
     <p>Vamos aprender a reproduzir áudios em HTML.</p>
     <audio preload="auto" controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        <p>Infelizmente o seu áudio nao consgeu reproduzir áudio</p>
        <p><a href="midia/guanacast-33.mp3">clique aqui para abaixar o audio MP3</a></p>
     </audio>
     
     <!--MP3 WAV OPP-->
</body>
</html>
